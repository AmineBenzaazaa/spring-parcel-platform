name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    name: mvnw verify (unit + Testcontainers)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      # GitHub-hosted runners ship Docker, which Testcontainers uses for Postgres, Kafka and Redis
      - name: Build and test
        run: ./mvnw -B -ntp verify
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: "**/target/surefire-reports/"

  dashboard:
    name: dashboard (typecheck, Vitest, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  e2e:
    name: e2e (Playwright against the full compose stack)
    needs: [verify, dashboard]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - name: Start the stack
        run: docker compose up -d --build --wait --wait-timeout 300
      - name: Install Playwright
        working-directory: dashboard
        run: npm ci --no-audit --no-fund && npx playwright install --with-deps chromium
      - name: Run e2e
        working-directory: dashboard
        run: npx playwright test
      - name: Stack logs on failure
        if: failure()
        run: docker compose logs --tail=200
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: dashboard/playwright-report/

  images:
    name: docker images build
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build all images (services + dashboard)
        run: docker compose build
