server:
  port: 8080

spring:
  application:
    name: gateway
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${AUTH_JWKS_URI:http://localhost:8081/.well-known/jwks.json}
          issuer-uri: ${AUTH_ISSUER:http://auth-service:8081}
  cloud:
    gateway:
      default-filters:
        # token bucket in Redis, shared by all gateway replicas; key = JWT subject, or client IP when anonymous
        - name: RequestRateLimiter
          args:
            redis-rate-limiter.replenishRate: ${RATE_LIMIT_REPLENISH:20}
            redis-rate-limiter.burstCapacity: ${RATE_LIMIT_BURST:40}
            redis-rate-limiter.requestedTokens: 1
            key-resolver: "#{@principalOrIpKeyResolver}"
      routes:
        - id: auth-service
          uri: ${AUTH_URI:http://localhost:8081}
          predicates:
            - Path=/api/auth/**
        - id: order-service
          uri: ${ORDER_URI:http://localhost:8082}
          predicates:
            - Path=/api/orders/**
        - id: dispatch-service
          uri: ${DISPATCH_URI:http://localhost:8083}
          predicates:
            - Path=/api/deliveries/**,/api/couriers/**
        - id: notification-service
          uri: ${NOTIFICATION_URI:http://localhost:8084}
          predicates:
            - Path=/api/notifications/**,/api/activity/**
        # demo only: lets the dashboard break the fake SMS provider to show the circuit breaker opening
        - id: demo-sms-provider
          uri: ${NOTIFICATION_URI:http://localhost:8084}
          predicates:
            - Path=/api/demo/sms-provider/{mode}
            - Method=POST
          filters:
            - SetPath=/fake-sms/admin/mode/{mode}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics,gateway
  endpoint:
    health:
      probes:
        enabled: true
  tracing:
    sampling:
      probability: 1.0
  metrics:
    tags:
      application: ${spring.application.name}
